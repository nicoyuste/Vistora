name: Vistora
options:
  bundleIdPrefix: com.nicoyuste
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions:
    - en
    - es
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
configs:
  Debug: debug
  Release: release
packages:
  DesignSystem:
    path: Packages/DesignSystem
  AppFeature:
    path: Packages/AppFeature
  PhotoAPI:
    path: Packages/PhotoAPI
  ExploreFeature:
    path: Packages/Features/ExploreFeature
    group: Packages/Features
  PhotoViewerFeature:
    path: Packages/Features/PhotoViewerFeature
    group: Packages/Features
  SettingsFeature:
    path: Packages/Features/SettingsFeature
    group: Packages/Features
targets:
  Vistora:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: AppFeature
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vistora
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - es
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicoyuste.vistora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
  VistoraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Vistora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicoyuste.vistora.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vistora:
    build:
      targets:
        Vistora: all
        VistoraUITests: [test]
    test:
      targets:
        - package: AppFeature/AppFeatureTests
        - package: ExploreFeature/ExploreFeatureTests
        - package: PhotoAPI/PhotoAPITests
        - package: SettingsFeature/SettingsFeatureTests
        - VistoraUITests
